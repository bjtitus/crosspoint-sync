<!-- iOS app icon: icon-source.svg with a larger mark, since iOS only rounds the corners
     (no adaptive mask to stay inside). Regenerate the iOS set with:
     rsvg-convert -w 1024 icon-ios.svg > /tmp/icon.png && npx tauri icon /tmp/icon.png -o /tmp/ios-icons
     then copy /tmp/ios-icons/ios/* to icons/ios/ and gen/apple/Assets.xcassets/AppIcon.appiconset/ -->
